# docker-compose.yml  →  PRODUCCIÓN (Azure/Railway)
# Usar con:  docker compose up -d
# Las imágenes se definen en .env (REGISTRY e IMAGE_TAG)
# NOTA: Usa broker MQTT embebido (Aedes - Legacy). Para EMQX ver docker-compose.dev.yml

services:

  backend:
    image: ${REGISTRY}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"   # API REST
      - "8083:8083"   # MQTT WebSocket (los players se conectan aquí)
      - "1883:1883"   # MQTT TCP (opcional, para clientes nativos)
    volumes:
      - uploads:/app/uploads     # Backup local de archivos (persistente)
    environment:
      PORT: "3000"
      MQTT_WS_PORT: "8083"
      MQTT_TCP_PORT: "1883"
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      # PostgreSQL
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA}
      # Cloudflare R2
      CLOUDFLARE_R2_ENDPOINT_URL: ${CLOUDFLARE_R2_ENDPOINT_URL}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"       # Dashboard admin
    depends_on:
      backend:
        condition: service_healthy

  player:
    image: ${REGISTRY}/player:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5174:80"     # Player web (WebView del MXQ apunta aquí)
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
