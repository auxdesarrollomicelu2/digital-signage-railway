# docker-compose.dev.yml  →  DESARROLLO LOCAL
# Usar con:  docker compose -f docker-compose.dev.yml up --build

services:

  emqx:
    image: emqx/emqx:5.8.3
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT TCP
      - "8083:8083"   # MQTT WebSocket
      - "18083:18083" # EMQX Dashboard
    environment:
      EMQX_NAME: digital_signage_broker
      EMQX_HOST: emqx
      EMQX_NODE__COOKIE: digital_signage_secret_cookie
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: AdminDev2024
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "emqx ping || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src:/app/src
    environment:
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA}
      CLOUDFLARE_R2_ENDPOINT_URL: ${CLOUDFLARE_R2_ENDPOINT_URL}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}
      BACKEND_URL: http://backend:3000
      USE_EXTERNAL_MQTT: "true"
      MQTT_BROKER_URL: mqtt://emqx:1883
    depends_on:
      emqx:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  player:
    build: ./player
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  emqx_data:
  emqx_log:
